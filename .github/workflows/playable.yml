name: Current fixed desktop behavior
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'codex/**']
  pull_request:
permissions:
  contents: read
env:
  CANDIDATE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: current-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  behavior:
    name: current (${{ matrix.suite }}, 1440x900 Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [q13, native, normal]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install locked source tools and production dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - name: Verify lock and build the selected source
        run: |
          node scripts/check_lock.mjs
          npm --prefix web run build
      - name: Install fixed browser and game fonts
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y fonts-noto-cjk
      - name: Declare and execute every current member
        run: node scripts/check-current-browser.mjs ${{ matrix.suite }} artifacts/current-${{ matrix.suite }}
      - name: Preserve actual reports and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            artifacts/current-${{ matrix.suite }}
            web/build-report
          retention-days: 30
          if-no-files-found: error
