name: M1 core checks
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'codex/**']
  pull_request:
env:
  CANDIDATE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install locked resource-check dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/chenyuan-art-venv"
          "$RUNNER_TEMP/chenyuan-art-venv/bin/python3" -m pip install --disable-pip-version-check -r art/requirements.txt
          "$RUNNER_TEMP/chenyuan-art-venv/bin/python3" -c "import sys, PIL; print(sys.version); print('Pillow', PIL.__version__)"
          echo "$RUNNER_TEMP/chenyuan-art-venv/bin" >> "$GITHUB_PATH"
      - run: npm run validate:core
      - name: Preserve actual core outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-core-${{ github.run_attempt }}
          path: web/core-report
          retention-days: 30
          if-no-files-found: error
